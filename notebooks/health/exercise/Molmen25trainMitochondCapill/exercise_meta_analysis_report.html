      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

response.\u0026#92;u003cbr\u0026#92;u003e3. \u0026#92;u003cstrong\u0026#92;u003eStatistical Equivalence:\u0026#92;u003c/strong\u0026#92;u003e Mitochondrial-content (+23% to +27%) and capillaries-per-fiber changes (+10% to +15%) did not differ significantly among ET, HIT, and SIT (\u0026#92;u003cmarimo-tex class=\u0026#92;\u0026quot;arithmatex\u0026#92;\u0026quot;\u0026#92;u003e||(P \u0026amp;gt; 0.138||)\u0026#92;u003c/marimo-tex\u0026#92;u003e) in the reported adjusted analyses.\u0026#92;u003cbr\u0026#92;u003e4. \u0026#92;u003cstrong\u0026#92;u003eEfficiency vs. Total Response:\u0026#92;u003c/strong\u0026#92;u003e The final two rows (Block B) are per-active-exercise-hour efficiency estimates and should not be interpreted as directly comparable in absolute magnitude with the preceding percentage-change rows (Block A).\u0026#92;u003cbr\u0026#92;u003e5. \u0026#92;u003cstrong\u0026#92;u003eInference Guard:\u0026#92;u003c/strong\u0026#92;u003e Visual color differences represent exercise intensity category relative magnitude (\u0026#92;u003cmarimo-tex class=\u0026#92;\u0026quot;arithmatex\u0026#92;\u0026quot;\u0026#92;u003e||(0.0||)\u0026#92;u003c/marimo-tex\u0026#92;u003e to \u0026#92;u003cmarimo-tex class=\u0026#92;\u0026quot;arithmatex\u0026#92;\u0026quot;\u0026#92;u003e||(1.0||)\u0026#92;u003c/marimo-tex\u0026#92;u003e), not statistical significance. Original effect estimates and 95% confidence intervals remain the basis for inference.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cbr\u003E---\u003Cbr\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-inver , "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch3 id=\u0026#92;\u0026quot;practical-exercise-prescription-takeaways\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udccc Practical Exercise Prescription Takeaways\u0026#92;u003c/h3\u0026#92;u003e\u0026#92;n\u0026#92;u003col\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eEquivalence of Exercise Intensity Categories:\u0026#92;u003c/strong\u0026#92;u003e \u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eLow/moderate endurance training (ET), high-intensity interval training (HIT), and sprint interval training (SIT) all produce \u0026#92;u003cstrong\u0026#92;u003eequivalent percentage increases in skeletal muscle mitochondrial content (~23% to 27%)\u0026#92;u003c/strong\u0026#92;u003e and \u0026#92;u003cstrong\u0026#92;u003ecapillary-to-fiber ratio (~10% to 15%)\u0026#92;u003c/strong\u0026#92;u003e.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eTime-Efficiency Advantage of SIT:\u0026#92;u003c/strong\u0026#92;u003e \u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eSprint Interval Training (SIT) requires \u0026#92;u003cstrong\u0026#92;u003e~8 hours total training time\u0026#92;u003c/strong\u0026#92;u003e compared to \u0026#92;u003cstrong\u0026#92;u003e~38.6 hours for ET\u0026#92;u003c/strong\u0026#92;u003e, making SIT \u0026#92;u003cstrong\u0026#92;u003e3.9x more time-efficient\u0026#92;u003c/strong\u0026#92;u003e for mitochondrial growth and \u0026#92;u003cstrong\u0026#92;u003e4.9x more efficient\u0026#92;u003c/strong\u0026#92;u003e for VO\u2082max gains per hour invested.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eHypertrophy vs Capillary Density Trade-off:\u0026#92;u003c/strong\u0026#92;u003e \u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eHigher exercise intensity (SIT/HIT) promotes greater muscle fiber hypertrophy (+11.9% CSA in SIT), which dilutes capillary density unless continuous endurance training (ET) is included to stimulate sustained capillary growth.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eUniversal Adaptability Across Lifespan and Disease:\u0026#92;u003c/strong\u0026#92;u003e \u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eMitochondrial adaptation capacity remains \u0026#92;u003cstrong\u0026#92;u003e100% intact throughout human aging (\u0026amp;gt;55 y)\u0026#92;u003c/strong\u0026#92;u003e and is \u0026#92;u003cstrong\u0026#92;u003euncompromised by chronic metabolic, cardiovascular, or pulmonary diseases (COPD)\u0026#92;u003c/strong\u0026#92;u003e.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003eBaseline Fitness is the Primary Modifier:\u0026#92;u003c/strong\u0026#92;u003e \u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eUntrained individuals experience the largest relative gains (\u0026#92;u003cstrong\u0026#92;u003e+30.4% mitochondria, +15% C/F, +13.1% VO\u2082max\u0026#92;u003c/strong\u0026#92;u003e), whereas well-trained athletes show smaller marginal gains (\u0026#92;u003cstrong\u0026#92;u003e+6.6% mitochondria, +4.5% VO\u2082max\u0026#92;u003c/strong\u0026#92;u003e).\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ol\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.0", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null
        }),
        writable: false,
